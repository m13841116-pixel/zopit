<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" width="100%" height="100%">
  <defs>
    <linearGradient id="zopitOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
  </defs>

  <g id="zopit-symbol" transform="translate(10, 10)">
    <!-- PURPLE CART BASKET & HANDLE (Behind Z) -->
