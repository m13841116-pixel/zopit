    <path
      d="M 120 72 
         L 172 72 
         C 178 72, 182 68, 185 62 
         L 194 36 
         C 197 28, 207 26, 212 32 
         C 215 36, 214 42, 209 48 
         L 201 70 
         C 195 86, 180 98, 162 98 
         L 115 98 
         Z"
      fill="#59257A"
    />

    <!-- Cart Basket Interior Cutout -->
    <path
